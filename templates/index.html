<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receipt OCR Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        form, .results {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>Receipt OCR Test</h1>
    <p>Upload an English receipt image to extract its text.</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <br>
        <button type="submit">Extract text</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if lines is defined %}
        <div class="results">
            <h2>Recognized text</h2>

            {% if lines %}
                {% for line in lines %}
                    <div>{{ line }}</div>
                {% endfor %}
            {% else %}
                <p>No text was detected.</p>
            {% endif %}
        </div>
    {% endif %}
</body>
</html>
